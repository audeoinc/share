# 動作確認用サンプル（prod）
service:
  name: lineage-api
  port: 443
  timeout_sec: 60

database:
  host: prod-db.internal
  port: 5432
  name: lineage_prod
  pool_size: 50
  read_replica: prod-db-ro.internal

logging:
  level: warn
  format: json
  destination: cloud-logging

features:
  physical_lineage: true
  column_lineage: true
  cache: true

retry:
  max_attempts: 5
  backoff_sec: 2
