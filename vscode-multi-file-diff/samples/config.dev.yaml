# 動作確認用サンプル（dev）
service:
  name: lineage-api
  port: 8080
  timeout_sec: 30

database:
  host: localhost
  port: 5432
  name: lineage_dev
  pool_size: 5

logging:
  level: debug
  format: text
  destination: stdout

features:
  physical_lineage: true
  column_lineage: false
  cache: false

retry:
  max_attempts: 3
  backoff_sec: 1
