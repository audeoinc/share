<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>フォント比較</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&family=Noto+Sans+JP:wght@400;600&family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+1:wght@400;600&family=M+PLUS+2:wght@400;600&family=Murecho:wght@400;600&family=Zen+Kaku+Gothic+Antique:wght@400;700&family=Kosugi+Maru&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --line:#e4e7ec; --ink:#1b1f2a; --mute:#667085; --brand:#2f4fd0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, sans-serif; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.note { margin:0 0 20px; color:var(--mute); font-size:13px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap:16px; }
  .sample { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .name { font-family: system-ui, sans-serif; font-size:12px; color:var(--brand); font-weight:600; margin-bottom:2px; }
  .desc { font-family: system-ui, sans-serif; font-size:11px; color:var(--mute); margin-bottom:12px; }
  .h { font-size:14px; font-weight:600; margin:0 0 8px; }
  .label { font-size:12px; font-weight:600; color:var(--mute); margin:0 0 3px; }
  .value { font-size:12px; font-weight:400; border:1px solid #cdd2da; border-radius:6px; padding:6px 8px; margin-bottom:10px; }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:10px; }
  .card .t { font-size:13px; font-weight:600; }
  .card .s { font-size:12px; color:var(--mute); margin-top:2px; }
  .badge { display:inline-block; font-size:11px; font-weight:600; background:#e7ebfb; color:var(--brand); border-radius:10px; padding:1px 8px; margin-bottom:6px; }
  .note2 { font-size:11px; line-height:16px; color:var(--mute); border-left:2px solid #cdd2da; padding-left:8px; margin-bottom:10px; }
  .long { font-size:12px; line-height:20px; }
  .en { font-size:12px; margin-top:10px; }
  .num { font-size:12px; margin-top:8px; color:var(--mute); }
</style>
</head>
<body>
<h1>フォント比較(実際の画面と同じ文字サイズ・太さ)</h1>
<p class="note">ラベルは 12px・中太・グレー、値は 12px・標準、カードのタイトルは 13px・中太。表示にはインターネット接続が必要です(Google Fonts)。</p>
<div class="grid" id="grid"></div>
<script>
const fonts = [
  ['IBM Plex Sans JP', '"IBM Plex Sans JP"', '今の設定。引き締まった、技術系の印象。英数字も同じ書体'],
  ['Noto Sans JP', '"Noto Sans JP"', '標準的で癖がない。無難'],
  ['BIZ UDPGothic', '"BIZ UDPGothic"', '業務向けの読みやすさ。Windows/Office に標準搭載(今回は Web 版)'],
  ['M PLUS 1', '"M PLUS 1"', '現代的で、少しやわらかい。字面が小さめ'],
  ['M PLUS 2', '"M PLUS 2"', 'M PLUS 1 の汎用版。太さの選択肢が多い'],
  ['Murecho', '"Murecho"', '細身で端正。余白が多く見える'],
  ['Zen Kaku Gothic Antique', '"Zen Kaku Gothic Antique"', '小さな文字でも潰れにくい、やや古典的な角ゴシック'],
  ['Inter + Noto Sans JP', '"Inter", "Noto Sans JP"', '英数字は Inter(多くのモダンなツールの標準)、日本語は Noto Sans JP'],
  ['Yu Gothic UI(以前の設定)', '"Yu Gothic UI", "Segoe UI"', 'Windows 標準。細く淡い'],
  ['Meiryo UI', '"Meiryo UI"', 'Windows 標準。骨太で、古い印象'],
];
const grid = document.getElementById('grid');
for (const [name, family, desc] of fonts) {
  const el = document.createElement('div');
  el.className = 'sample';
  el.style.fontFamily = family + ', sans-serif';
  el.innerHTML = `
    <div class="name">${name}</div><div class="desc">${desc}</div>
    <div class="h">配信情報 / Delivery</div>
    <div class="label">配信名 <span style="color:#c00">*</span></div>
    <div class="value">Fall Arrivals</div>
    <div class="label">テーマ(配信全体の前提。メールには出ません)</div>
    <div class="value">季節の変わり目スタイル</div>
    <div class="card"><span class="badge">季節感</span><div class="t">秋色アウターで街歩き</div><div class="s">在庫豊富で売上上昇中のトレンチコートやレインパーカーを活かし、季節の散歩コーデを提案。</div></div>
    <div class="note2"><b>AIの理由:</b> 10月初旬で肌寒くなる時期。売上上昇中のニット類が主役になる季節感重視のテーマ。</div>
    <div class="label">制作指示</div>
    <div class="value long">メインビジュアルは「秋のコーディネート集合」を全幅で配置し、温かみのあるブラウン〜テラコッタ系の背景で季節感を演出。商品は上からライトジャケット、トレンチコート、ウールコート、レインパーカーの順に4点グリッド表示。</div>
    <div class="en"><b style="font-weight:600">Find Your Perfect Fall Layer</b><br>From trench to wool, explore new arrivals made to make each outing effortlessly stylish.</div>
    <div class="num">P05 ・ ¥14,800 ・ $128.00 ・ 在庫 150 ・ ★4.6 ・ 2026/10/01 10:00</div>`;
  grid.appendChild(el);
}
</script>
</body>
</html>
