<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cdock web</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icon.png" alt="" width="20" height="20"><span>cdock</span></div>
  <label class="cwd"><span>フォルダ</span><button type="button" id="cwd-up" class="ghost cwdup" title="一つ上のフォルダへ (Alt+↑)">↑</button><input id="cwd" list="recent-dirs" spellcheck="false" autocomplete="off"><datalist id="recent-dirs"></datalist></label>
  <button id="cwd-browse" class="ghost" title="フォルダを選択">📁 選択</button>
  <span class="fs" title="文字サイズ (画面全体)"><button id="fs-down" class="ghost">A−</button><button id="fs-up" class="ghost">A＋</button></span>
  <button id="density" class="ghost" title="行間">≡</button>
  <button id="theme" class="ghost theme" title="テーマ: 自動 / ライト / ダーク">◐</button>
  <select id="model" title="モデル">
    <option value="">モデル: 既定</option>
    <option value="claude-opus-5-5">Opus 5.5 (高性能)</option>
    <option value="claude-sonnet-5-5">Sonnet 5.5 (軽快)</option>
    <option value="claude-haiku-4-5">Haiku 4.5 (最軽量)</option>
  </select>
  <select id="mode" title="権限モード">
    <option value="default">確認しながら進める</option>
    <option value="acceptEdits">編集は自動で許可</option>
    <option value="plan">プランモード</option>
    <option value="auto">自動 (分類器が判断)</option>
  </select>
</header>
<div class="shell">
  <aside class="side" id="side">
    <div class="grip grip-r" id="grip-side" role="separator" aria-orientation="vertical" aria-label="サイドバーの幅" tabindex="0" title="ドラッグで幅を変更 / ダブルクリックで元に戻す"></div>
    <div class="tabs"><button id="tab-sessions" class="on">会話</button><button id="tab-files">ファイル</button><button id="tab-git">変更 <span id="gitcount" class="badge" hidden></span></button></div>
    <div id="pane-sessions" class="pane"><button id="new" class="newbtn">＋ 新しい会話</button><div id="sessions"></div></div>
    <div id="pane-files" class="pane" hidden>
      <div class="fsearch"><input id="fsearch" placeholder="ファイルを検索 (Ctrl+P)" autocomplete="off" spellcheck="false"><button id="fsmode" class="ghost" title="ファイル名 / 中身 を切り替え">名前</button></div>
      <div id="fresults" hidden></div>
      <div id="tree"></div>
    </div>
    <div id="pane-git" class="pane" hidden><div class="githead"><span id="gitbranch" class="gitbranch"></span><button id="gitrefresh" class="ghost" title="更新">↻</button></div><div id="gitlist"></div>
      <div id="commitbox" class="commitbox" hidden>
        <textarea id="commitmsg" rows="2" placeholder="コミットメッセージ (Ctrl+Enter で確定)"></textarea>
        <div class="crow"><span id="commitnote" class="cnote"></span><button id="commitbtn" class="send" disabled>コミット</button></div>
      </div></div>
  </aside>
  <section class="main">
    <main id="chat" class="chat"><div class="empty" id="empty"><img src="icon.png" width="44" height="44" alt=""><h1>何をしましょうか？</h1><p>「ファイル」タブでクリックするとプレビュー、＠ で入力欄に @パス を入れられます。</p></div></main>
    <footer class="composer">
      <div class="box">
        <div id="slash" class="slash" hidden></div>
        <div id="attach" class="attach" hidden></div>
        <textarea id="input" rows="1" placeholder="Claude に指示する (Enter で送信 / Shift+Enter で改行)"></textarea>
        <div class="actions"><button id="attbtn" class="ghost attbtn" title="ファイルを添付 (ドラッグ＆ドロップ / Ctrl+V の貼り付けも可)">📎</button><input id="filepick" type="file" multiple hidden><span id="status" class="status"></span><button id="stop" class="stop" hidden>■ 停止</button><button id="send" class="send">送信</button></div>
      </div>
    </footer>
  </section>
  <aside id="preview" class="preview" hidden>
    <div class="grip grip-l" id="grip-prev" role="separator" aria-orientation="vertical" aria-label="プレビューの幅" tabindex="0" title="ドラッグで幅を変更 / ダブルクリックで元に戻す"></div>
    <div class="phead"><span id="pname" class="pname"></span><button id="pmode" class="ghost" hidden title="表示 / ソースの切り替え">ソース</button><button id="pinsert" class="ghost" title="入力欄に @パス を挿入">＠ 挿入</button><button id="pclose" class="ghost" title="閉じる">✕</button></div>
    <div id="pbody" class="pbody"></div>
  </aside>
</div>
<div id="dlg" class="dlg" hidden>
  <div class="dlg-card" role="dialog" aria-label="フォルダを選択">
    <div class="dlg-head"><span>フォルダを選択</span><button id="dlg-close" class="ghost" title="閉じる">✕</button></div>
    <div class="dlg-body">
      <nav class="dlg-side"><div class="dlg-h">場所</div><div id="dlg-places"></div><div class="dlg-h">最近使った</div><div id="dlg-recent"></div></nav>
      <section class="dlg-main">
        <div class="dlg-path"><button id="dlg-up" class="ghost" title="ひとつ上へ">↑</button><input id="dlg-pathinput" spellcheck="false" autocomplete="off"></div>
        <div id="dlg-note" class="dlg-note" hidden></div>
        <input id="dlg-filter" class="dlg-filter" placeholder="フォルダ名で絞り込み (Enter で先頭を開く)" autocomplete="off">
        <div id="dlg-list" class="dlg-list"></div>
        <label class="dlg-hid"><input type="checkbox" id="dlg-hidden"> 隠しフォルダを表示</label>
      </section>
    </div>
    <div class="dlg-foot"><span id="dlg-cur" class="dlg-cur"></span><button id="dlg-cancel" class="ghost">キャンセル</button><button id="dlg-ok" class="send">このフォルダを開く</button></div>
  </div>
</div>
<div id="dropzone" class="dropzone" hidden><div>📎 ここにドロップして添付</div></div>
<script src="app.js" type="module"></script>
</body>
</html>
