# cdock 専用 tmux 設定 (専用ソケットでのみ有効)
set -g mouse on
set -g escape-time 10
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g status-style "bg=#1f2430,fg=#a0a8b7"
set -g status-left " cdock "
set -g status-right "Alt+1 Files  Alt+2 Claude  Alt+3 Shell  Alt+z 拡大  Alt+q 終了 "
set -g pane-border-style "fg=#3a4152"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[bold],}#{pane_title} "

# フォーカス移動 (プレフィックス不要)
bind -n M-1 select-pane -t '#{@cdock_files}'
bind -n M-2 select-pane -t '#{@cdock_claude}'
bind -n M-3 select-pane -t '#{@cdock_shell}'
bind -n M-z resize-pane -Z
bind -n M-q confirm-before -p "cdock を終了しますか? (y/n)" kill-server
